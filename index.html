<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Believe AI — By Ashwin &amp; Kanha</title>
  <link rel="icon" type="image/png" href="logo.png" />
  <style>
    :root {
      --bg: #07080f;
      --panel: #0e111d;
      --panel-2: #14192a;
      --border: rgba(255, 255, 255, 0.08);
      --text: #edf1ff;
      --muted: #8b95b5;
      --accent: #00e5ff;
      --accent-2: #7c3aed;
      --glow: rgba(0, 229, 255, 0.28);
      --danger: #ff3b6b;
      --online: #22c55e;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      height: 100%;
      background:
        radial-gradient(circle at 12% 10%, var(--glow), transparent 36%),
        radial-gradient(circle at 88% 90%, rgba(124, 58, 237, 0.18), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background 0.35s ease;
    }

    .app {
      max-width: 980px;
      height: 100dvh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      padding: 12px;
      gap: 10px;
    }

    .header {
      background: rgba(14, 17, 29, 0.85);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35), 0 0 24px -10px var(--glow);
    }

    .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }

    .logo {
      width: 42px;
      height: 42px;
      border-radius: 12px;
      background: #10162e;
      overflow: hidden;
      display: grid;
      place-items: center;
      box-shadow: 0 0 18px var(--glow);
      flex-shrink: 0;
    }

    .logo img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .brand-info { min-width: 0; }
    .title-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .title {
      font-weight: 800;
      font-size: 1.05rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      background: linear-gradient(90deg, #ffffff, var(--accent));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--muted);
      white-space: nowrap;
    }

    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.72rem;
      color: var(--online);
      margin-top: 2px;
      font-weight: 600;
      letter-spacing: 0.06em;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--online);
      box-shadow: 0 0 10px var(--online);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.35); opacity: 0.55; }
    }

    .header-actions { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }

    .vibe-select, .icon-btn {
      background: var(--panel-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      outline: none;
      transition: 0.2s;
    }

    .vibe-select:hover, .icon-btn:hover {
      border-color: var(--accent);
      box-shadow: 0 0 12px -4px var(--glow);
    }

    .icon-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    .modes {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }
    .modes::-webkit-scrollbar { display: none; }

    .mode-btn {
      flex-shrink: 0;
      border: 1px solid var(--border);
      background: rgba(14, 17, 29, 0.75);
      color: var(--muted);
      padding: 7px 13px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .mode-btn:hover { color: var(--text); border-color: rgba(255,255,255,0.2); }

    .mode-btn.active {
      color: #07080f;
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 16px -2px var(--glow);
    }

    .chat-box {
      flex: 1;
      overflow-y: auto;
      background: rgba(14, 17, 29, 0.65);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
    }

    .chat-box::-webkit-scrollbar { width: 6px; }
    .chat-box::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.12); border-radius: 99px; }

    .welcome {
      margin: auto;
      text-align: center;
      max-width: 560px;
      padding: 26px 20px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(20, 25, 42, 0.85), rgba(14, 17, 29, 0.75));
      border: 1px solid var(--border);
      box-shadow: 0 0 36px -14px var(--glow);
    }

    .welcome h2 { font-size: 1.25rem; margin-bottom: 8px; color: #fff; }
    .welcome p { color: var(--muted); font-size: 0.9rem; line-height: 1.5; margin-bottom: 18px; }
    .chips { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }

    .chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 12px;
      border-radius: 12px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .chip:hover {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-1px);
    }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 84%;
      gap: 5px;
      animation: fadeUp 0.2s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.bot { align-self: flex-start; align-items: flex-start; }

    .msg-meta {
      font-size: 0.7rem;
      color: var(--muted);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 4px;
    }

    .bubble {
      padding: 12px 15px;
      border-radius: 16px;
      font-size: 0.93rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg.user .bubble {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06070d;
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }

    .msg.bot .bubble {
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble p + p { margin-top: 8px; }
    .bubble ul, .bubble ol { margin: 8px 0 8px 20px; }
    .bubble li + li { margin-top: 4px; }
    .bubble code {
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 1px 6px;
      border-radius: 6px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.85em;
      color: var(--accent);
    }

    .user-img {
      max-width: 240px;
      max-height: 220px;
      border-radius: 10px;
      display: block;
      margin-bottom: 6px;
      object-fit: cover;
      border: 1px solid rgba(0, 0, 0, 0.2);
    }

    /* Clean watermark-free crop frame */
    .gen-img-wrap {
      width: 100%;
      max-width: 420px;
      aspect-ratio: 1 / 1;
      border-radius: 12px;
      overflow: hidden;
      margin-top: 8px;
      border: 1px solid var(--border);
      background: rgba(0, 0, 0, 0.35);
      cursor: zoom-in;
    }

    .gen-img {
      width: 100%;
      height: 113%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .img-actions { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }

    .img-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 5px 11px;
      font-size: 0.76rem;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: 0.2s;
    }
    .img-btn:hover { border-color: var(--accent); color: var(--accent); }
    .img-btn.danger:hover { border-color: var(--danger); color: var(--danger); }

    /* Full View Lightbox */
    .img-modal {
      position: fixed;
      inset: 0;
      background: rgba(5, 6, 12, 0.88);
      backdrop-filter: blur(8px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 100;
    }

    .img-modal.open { display: flex; }

    .img-modal-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      max-width: 92vw;
    }

    .modal-img-wrap {
      width: min(86vw, 76vh, 640px);
      aspect-ratio: 1 / 1;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
      background: #07080f;
    }

    .modal-img-wrap img {
      width: 100%;
      height: 113%;
      object-fit: cover;
      object-position: top center;
      display: block;
    }

    .img-modal-actions { display: flex; gap: 10px; }

    .code-wrap {
      margin: 10px 0;
      background: #070912;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      overflow: hidden;
    }

    .code-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 6px 10px;
      background: rgba(255, 255, 255, 0.04);
      font-size: 0.72rem;
      color: var(--muted);
    }

    .code-wrap pre {
      padding: 10px 12px;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.82rem;
      line-height: 1.45;
      color: #dbe7ff;
    }

    .copy-mini {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
      border-radius: 6px;
      padding: 2px 7px;
      font-size: 0.68rem;
      cursor: pointer;
    }
    .copy-mini:hover { color: var(--accent); border-color: var(--accent); }

    .typing-wrap { display: inline-flex; align-items: center; gap: 10px; font-size: 0.85rem; color: var(--muted); }
    .typing { display: inline-flex; gap: 5px; padding: 4px 2px; }
    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
      animation: bounce 1.1s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.16s; }
    .typing span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.55); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }

    .composer-wrap {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .attachment-bar {
      display: none;
      align-items: center;
      gap: 10px;
      background: rgba(20, 25, 42, 0.92);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 6px 10px;
      width: fit-content;
      max-width: 100%;
    }

    .attachment-bar.show { display: flex; }

    .attachment-bar img {
      width: 42px;
      height: 42px;
      border-radius: 8px;
      object-fit: cover;
    }

    .attachment-name {
      font-size: 0.78rem;
      color: var(--text);
      max-width: 200px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .remove-attach {
      background: rgba(255, 59, 107, 0.18);
      color: var(--danger);
      border: none;
      border-radius: 50%;
      width: 24px;
      height: 24px;
      font-weight: 800;
      cursor: pointer;
    }

    .plus-menu {
      position: absolute;
      bottom: calc(100% + 8px);
      left: 0;
      background: #14192a;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 14px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      min-width: 190px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      z-index: 30;
    }

    .plus-menu.open { display: flex; }

    .plus-item {
      background: transparent;
      border: none;
      color: var(--text);
      padding: 9px 12px;
      border-radius: 10px;
      font-size: 0.84rem;
      font-weight: 600;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: 0.15s;
    }

    .plus-item:hover { background: rgba(255, 255, 255, 0.08); color: var(--accent); }

    .composer {
      background: rgba(14, 17, 29, 0.9);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    .composer:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 18px -6px var(--glow);
    }

    .plus-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--panel-2);
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 1.4rem;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
      transition: 0.2s;
    }

    .plus-btn:hover, .plus-btn.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(0, 229, 255, 0.1);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: none;
      outline: none;
      max-height: 140px;
      line-height: 1.45;
      padding: 6px 4px;
    }

    textarea::placeholder { color: var(--muted); }

    .send-btn {
      background: linear-gradient(135deg, var(--accent), var(--accent-2));
      color: #06070d;
      border: none;
      border-radius: 12px;
      padding: 10px 16px;
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      flex-shrink: 0;
    }

    .send-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .send-btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    @media (max-width: 640px) {
      .app { padding: 8px; }
      .header { flex-wrap: wrap; padding: 10px 12px; }
      .header-actions { width: 100%; justify-content: space-between; }
      .vibe-select { flex: 1; }
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <img src="logo.png" alt="Believe AI" />
        </div>
        <div class="brand-info">
          <div class="title-row">
            <span class="title">BELIEVE AI</span>
            <span class="badge">By Ashwin &amp; Kanha</span>
          </div>
          <div class="status"><span class="dot"></span>ONLINE</div>
        </div>
      </div>

      <div class="header-actions">
        <select id="vibeSelect" class="vibe-select" title="Personality Vibe">
          <option value="balanced">Vibe: Balanced</option>
          <option value="anime">Vibe: Anime Rival</option>
          <option value="sarcastic">Vibe: Sarcastic</option>
          <option value="serious">Vibe: Dead Serious</option>
        </select>
        <button id="clearBtn" class="icon-btn danger" title="Clear chat">Clear</button>
      </div>
    </header>

    <nav class="modes" id="modeBar" aria-label="AI Modes">
      <button class="mode-btn active" data-mode="auto">⚡ Auto</button>
      <button class="mode-btn" data-mode="gaming">🎮 Gaming Buddy</button>
      <button class="mode-btn" data-mode="study">📚 Study Helper</button>
      <button class="mode-btn" data-mode="tech">💻 Tech Guru</button>
      <button class="mode-btn" data-mode="roaster">🔥 Roaster</button>
      <button class="mode-btn" data-mode="image">🎨 Image Gen</button>
    </nav>

    <main id="chatBox" class="chat-box"></main>

    <div class="composer-wrap">
      <div id="attachmentBar" class="attachment-bar">
        <img id="attachThumb" src="" alt="Preview" />
        <span id="attachName" class="attachment-name"></span>
        <button id="removeAttach" type="button" class="remove-attach" title="Remove photo">×</button>
      </div>

      <div id="plusMenu" class="plus-menu">
        <button type="button" id="uploadPhotoBtn" class="plus-item">📷 Upload Photo</button>
        <button type="button" id="createImgBtn" class="plus-item">🎨 Create Image</button>
      </div>

      <input type="file" id="imageInput" accept="image/*" hidden />

      <form id="composer" class="composer">
        <button id="plusBtn" type="button" class="plus-btn" title="Attach or Create">+</button>
        <textarea id="promptInput" rows="1" placeholder="Mission batao... (Enter to send)"></textarea>
        <button id="sendBtn" type="submit" class="send-btn">SEND ⚡</button>
      </form>
    </div>
  </div>

  <div id="imgModal" class="img-modal" aria-hidden="true">
    <div class="img-modal-box">
      <div class="modal-img-wrap">
        <img id="modalImg" src="" alt="Full View" />
      </div>
      <div class="img-modal-actions">
        <button type="button" id="modalDownload" class="img-btn">⬇ Download Clean</button>
        <button type="button" id="modalClose" class="img-btn danger">✕ Close</button>
      </div>
    </div>
  </div>

  <script>
    const STORAGE_KEY = "believe_ai_public_state_v1";

    const MODE_CONFIG = {
      auto: {
        accent: "#00e5ff",
        accent2: "#7c3aed",
        glow: "rgba(0, 229, 255, 0.28)",
        chips: [
          "Minecraft survival pro tips do",
          "Photosynthesis simple mein samjhao",
          "Under ₹20k best gaming phone?",
          "Mujhe ek tagda roast do"
        ]
      },
      gaming: {
        accent: "#22d3ee",
        accent2: "#2563eb",
        glow: "rgba(34, 211, 238, 0.30)",
        chips: [
          "Minecraft PvP God loadout batao",
          "Blox Fruits fast level up strat?",
          "Chess mein opening trap sikhao",
          "Clutch karne ka pro mindset kya hai?"
        ]
      },
      study: {
        accent: "#34d399",
        accent2: "#059669",
        glow: "rgba(52, 211, 153, 0.28)",
        chips: [
          "Newton's 3 laws short mein samjhao",
          "Algebra quadratic formula trick do",
          "Exam se 1 din pehle revision plan",
          "Tenses table simple Hinglish mein"
        ]
      },
      tech: {
        accent: "#a78bfa",
        accent2: "#6d28d9",
        glow: "rgba(167, 139, 250, 0.30)",
        chips: [
          "OIS vs EIS camera difference?",
          "Windows PC fast karne ke 5 steps",
          "Snapdragon vs Dimensity kaunsa best?",
          "Free video editing apps without watermark"
        ]
      },
      roaster: {
        accent: "#ff3b6b",
        accent2: "#ea580c",
        glow: "rgba(255, 59, 107, 0.30)",
        chips: [
          "Main apne aap ko pro gamer samajhta hoon, roast me",
          "Kal se padhai pakka shuru karunga",
          "Mera friend hamesha late aata hai, roast line do",
          "Ek anime style reality check do"
        ]
      },
      image: {
        accent: "#f472b6",
        accent2: "#7c3aed",
        glow: "rgba(244, 114, 182, 0.30)",
        chips: [
          "Cyberpunk samurai standing in neon Tokyo rain, 4k",
          "Cute glowing baby dragon sitting on a gaming keyboard",
          "Futuristic flying car over a neon city at sunset",
          "Anime warrior with blue lightning aura, dark background"
        ]
      }
    };

    let state = loadState();
    let isBusy = false;
    let pendingImage = null;
    let modalCurrentUrl = "";

    const chatBox = document.getElementById("chatBox");
    const promptInput = document.getElementById("promptInput");
    const sendBtn = document.getElementById("sendBtn");
    const composer = document.getElementById("composer");
    const modeBar = document.getElementById("modeBar");
    const vibeSelect = document.getElementById("vibeSelect");
    const clearBtn = document.getElementById("clearBtn");

    const plusBtn = document.getElementById("plusBtn");
    const plusMenu = document.getElementById("plusMenu");
    const uploadPhotoBtn = document.getElementById("uploadPhotoBtn");
    const createImgBtn = document.getElementById("createImgBtn");
    const imageInput = document.getElementById("imageInput");
    const attachmentBar = document.getElementById("attachmentBar");
    const attachThumb = document.getElementById("attachThumb");
    const attachName = document.getElementById("attachName");
    const removeAttach = document.getElementById("removeAttach");

    const imgModal = document.getElementById("imgModal");
    const modalImg = document.getElementById("modalImg");
    const modalDownload = document.getElementById("modalDownload");
    const modalClose = document.getElementById("modalClose");

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return {
            mode: MODE_CONFIG[parsed.mode] ? parsed.mode : "auto",
            vibe: parsed.vibe || "balanced",
            messages: Array.isArray(parsed.messages) ? parsed.messages : []
          };
        }
      } catch (_) {}
      return { mode: "auto", vibe: "balanced", messages: [] };
    }

    function saveState() {
      try {
        const safeMessages = state.messages.map((m) => {
          const copy = { ...m };
          if (copy.image) {
            delete copy.image;
            delete copy.previewUrl;
            copy.hadImage = true;
          }
          return copy;
        });
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          mode: state.mode,
          vibe: state.vibe,
          messages: safeMessages
        }));
      } catch (_) {}
    }

    function applyTheme() {
      const cfg = MODE_CONFIG[state.mode] || MODE_CONFIG.auto;
      document.documentElement.style.setProperty("--accent", cfg.accent);
      document.documentElement.style.setProperty("--accent-2", cfg.accent2);
      document.documentElement.style.setProperty("--glow", cfg.glow);
      document.querySelectorAll(".mode-btn").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.mode === state.mode);
      });
      vibeSelect.value = state.vibe;
      promptInput.placeholder = state.mode === "image"
        ? "Image prompt likho (English mein best result)..."
        : "Mission batao... (Enter to send)";
      sendBtn.textContent = state.mode === "image" ? "CREATE 🎨" : "SEND ⚡";
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatMarkdown(text) {
      const codeBlocks = [];
      let safe = escapeHtml(text);

      safe = safe.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, lang, code) => {
        const idx = codeBlocks.length;
        const cleanCode = code.trimEnd();
        codeBlocks.push(
          `<div class="code-wrap"><div class="code-head"><span>${lang || "code"}</span><button type="button" class="copy-mini" data-copy-code="${idx}">Copy</button></div><pre><code>${cleanCode}</code></pre></div>`
        );
        return `@@CODEBLOCK_${idx}@@`;
      });

      safe = safe.replace(/`([^`]+)`/g, "<code>$1</code>");
      safe = safe.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      safe = safe.replace(/\*([^*]+)\*/g, "<em>$1</em>");

      const lines = safe.split("\n");
      let html = "";
      let inUl = false;
      let inOl = false;

      const closeLists = () => {
        if (inUl) { html += "</ul>"; inUl = false; }
        if (inOl) { html += "</ol>"; inOl = false; }
      };

      for (const line of lines) {
        const ulMatch = line.match(/^\s*[-*]\s+(.*)$/);
        const olMatch = line.match(/^\s*\d+\.\s+(.*)$/);
        if (ulMatch) {
          if (inOl) { html += "</ol>"; inOl = false; }
          if (!inUl) { html += "<ul>"; inUl = true; }
          html += `<li>${ulMatch[1]}</li>`;
        } else if (olMatch) {
          if (inUl) { html += "</ul>"; inUl = false; }
          if (!inOl) { html += "<ol>"; inOl = true; }
          html += `<li>${olMatch[1]}</li>`;
        } else if (line.trim() === "") {
          closeLists();
        } else if (line.trim().startsWith("@@CODEBLOCK_")) {
          closeLists();
          html += line.trim();
        } else {
          closeLists();
          html += `<p>${line}</p>`;
        }
      }
      closeLists();

      codeBlocks.forEach((block, i) => {
        html = html.replace(`@@CODEBLOCK_${i}@@`, block);
      });

      return html;
    }

    function renderChat() {
      chatBox.innerHTML = "";
      if (state.messages.length === 0) {
        const cfg = MODE_CONFIG[state.mode] || MODE_CONFIG.auto;
        const welcome = document.createElement("div");
        welcome.className = "welcome";
        welcome.innerHTML = state.mode === "image"
          ? `
            <h2>🎨 Believe AI — Image Studio</h2>
            <p>Jo imagine karo, likh do — 100% free &amp; watermark-free image turant banegi.</p>
            <div class="chips">
              ${cfg.chips.map((c) => `<button type="button" class="chip">${escapeHtml(c)}</button>`).join("")}
            </div>
          `
          : `
            <h2>⚡ "Hmph... toh finally summon kar hi liya."</h2>
            <p>Main hoon <strong>Believe AI</strong> (Coded by Ashwin, Idea by Kanha). <strong>+</strong> button se photo upload karo ya image banao!</p>
            <div class="chips">
              ${cfg.chips.map((c) => `<button type="button" class="chip">${escapeHtml(c)}</button>`).join("")}
            </div>
          `;
        welcome.querySelectorAll(".chip").forEach((chip) => {
          chip.addEventListener("click", () => sendMessage(chip.textContent));
        });
        chatBox.appendChild(welcome);
        return;
      }

      state.messages.forEach((m, idx) => {
        const wrap = document.createElement("div");
        wrap.className = `msg ${m.role === "user" ? "user" : "bot"}`;

        const meta = document.createElement("div");
        meta.className = "msg-meta";
        if (m.role === "user") {
          meta.innerHTML = `<span>You</span>`;
        } else if (m.type === "image") {
          meta.innerHTML = `<span>🎨 Believe AI Image</span>`;
        } else {
          meta.innerHTML = `<span>⚡ Believe AI</span><button type="button" class="copy-mini" data-copy-msg="${idx}">Copy</button>`;
        }

        const bubble = document.createElement("div");
        bubble.className = "bubble";

        if (m.role === "user") {
          let inner = "";
          if (m.previewUrl) {
            inner += `<img src="${m.previewUrl}" alt="Uploaded" class="user-img" />`;
          } else if (m.hadImage) {
            inner += `<p><em>📷 [Photo attached]</em></p>`;
          }
          if (m.text) {
            inner += `<p>${escapeHtml(m.text).replace(/\n/g, "<br>")}</p>`;
          }
          bubble.innerHTML = inner;
        } else if (m.type === "image") {
          const safeUrl = escapeHtml(m.url);
          const safePrompt = escapeHtml(m.prompt || "");
          bubble.innerHTML = `
            <p><strong>Prompt:</strong> ${safePrompt}</p>
            <div class="gen-img-wrap" data-view-img="${safeUrl}">
              <img src="${safeUrl}" alt="${safePrompt}" class="gen-img" loading="lazy" />
            </div>
            <div class="img-actions">
              <button type="button" class="img-btn" data-download-img="${safeUrl}">⬇ Download</button>
              <button type="button" class="img-btn" data-view-img="${safeUrl}">🔍 Full View</button>
            </div>
          `;
        } else {
          bubble.innerHTML = formatMarkdown(m.text);
        }

        wrap.appendChild(meta);
        wrap.appendChild(bubble);
        chatBox.appendChild(wrap);
      });

      chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function downloadCleanImage(url, btn) {
      const oldText = btn.textContent;
      btn.textContent = "Saving...";
      btn.disabled = true;
      try {
        const resp = await fetch(url);
        if (!resp.ok) throw new Error("Fetch failed");
        const srcBlob = await resp.blob();
        const srcUrl = URL.createObjectURL(srcBlob);
        const img = await new Promise((resolve, reject) => {
          const i = new Image();
          i.onload = () => resolve(i);
          i.onerror = () => reject(new Error("Load failed"));
          i.src = srcUrl;
        });

        const w = img.naturalWidth;
        const cropH = Math.round(img.naturalHeight * 0.885);
        const canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = cropH;
        canvas.getContext("2d").drawImage(img, 0, 0, w, cropH, 0, 0, w, cropH);
        URL.revokeObjectURL(srcUrl);

        const cleanBlob = await new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.94));
        const dlUrl = URL.createObjectURL(cleanBlob);
        const a = document.createElement("a");
        a.href = dlUrl;
        a.download = `believe-ai-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(dlUrl), 1500);
        btn.textContent = "Saved!";
      } catch (_) {
        btn.textContent = "Retry!";
      } finally {
        btn.disabled = false;
        setTimeout(() => (btn.textContent = oldText), 1500);
      }
    }

    function openImageModal(url) {
      modalCurrentUrl = url;
      modalImg.src = url;
      imgModal.classList.add("open");
      imgModal.setAttribute("aria-hidden", "false");
    }

    function closeImageModal() {
      imgModal.classList.remove("open");
      imgModal.setAttribute("aria-hidden", "true");
      modalImg.src = "";
      modalCurrentUrl = "";
    }

    modalClose.addEventListener("click", closeImageModal);
    imgModal.addEventListener("click", (e) => {
      if (e.target === imgModal) closeImageModal();
    });
    modalDownload.addEventListener("click", () => {
      if (modalCurrentUrl) downloadCleanImage(modalCurrentUrl, modalDownload);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && imgModal.classList.contains("open")) closeImageModal();
    });

    function compressImage(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onerror = () => reject(new Error("Photo read nahi ho payi."));
        reader.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Invalid image file."));
          img.onload = () => {
            const maxDim = 1024;
            let w = img.width;
            let h = img.height;
            if (w > maxDim || h > maxDim) {
              if (w > h) { h = Math.round((h * maxDim) / w); w = maxDim; }
              else { w = Math.round((w * maxDim) / h); h = maxDim; }
            }
            const canvas = document.createElement("canvas");
            canvas.width = w;
            canvas.height = h;
            canvas.getContext("2d").drawImage(img, 0, 0, w, h);
            const dataUrl = canvas.toDataURL("image/jpeg", 0.82);
            resolve({
              mimeType: "image/jpeg",
              data: dataUrl.split(",")[1],
              previewUrl: dataUrl,
              name: file.name || "photo.jpg"
            });
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
      });
    }

    function clearAttachment() {
      pendingImage = null;
      imageInput.value = "";
      attachmentBar.classList.remove("show");
      attachThumb.src = "";
      attachName.textContent = "";
    }

    plusBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      const open = plusMenu.classList.toggle("open");
      plusBtn.classList.toggle("active", open);
    });

    document.addEventListener("click", (e) => {
      if (!plusMenu.contains(e.target) && e.target !== plusBtn) {
        plusMenu.classList.remove("open");
        plusBtn.classList.remove("active");
      }
    });

    uploadPhotoBtn.addEventListener("click", () => {
      plusMenu.classList.remove("open");
      plusBtn.classList.remove("active");
      imageInput.click();
    });

    createImgBtn.addEventListener("click", () => {
      plusMenu.classList.remove("open");
      plusBtn.classList.remove("active");
      clearAttachment();
      state.mode = "image";
      saveState();
      applyTheme();
      if (state.messages.length === 0) renderChat();
      promptInput.focus();
    });

    imageInput.addEventListener("change", async () => {
      const file = imageInput.files?.[0];
      if (!file) return;
      try {
        pendingImage = await compressImage(file);
        attachThumb.src = pendingImage.previewUrl;
        attachName.textContent = pendingImage.name;
        attachmentBar.classList.add("show");
        if (state.mode === "image") {
          state.mode = "auto";
          applyTheme();
        }
        promptInput.focus();
      } catch (err) {
        alert(err.message);
      }
    });

    removeAttach.addEventListener("click", clearAttachment);

    chatBox.addEventListener("click", async (e) => {
      const msgBtn = e.target.closest("[data-copy-msg]");
      if (msgBtn) {
        const idx = Number(msgBtn.dataset.copyMsg);
        await navigator.clipboard.writeText(state.messages[idx]?.text || "");
        msgBtn.textContent = "Copied!";
        setTimeout(() => (msgBtn.textContent = "Copy"), 1200);
        return;
      }

      const codeBtn = e.target.closest("[data-copy-code]");
      if (codeBtn) {
        const pre = codeBtn.closest(".code-wrap")?.querySelector("pre");
        if (pre) {
          await navigator.clipboard.writeText(pre.textContent);
          codeBtn.textContent = "Copied!";
          setTimeout(() => (codeBtn.textContent = "Copy"), 1200);
        }
        return;
      }

      const dlBtn = e.target.closest("[data-download-img]");
      if (dlBtn) {
        downloadCleanImage(dlBtn.dataset.downloadImg, dlBtn);
        return;
      }

      const viewEl = e.target.closest("[data-view-img]");
      if (viewEl) {
        openImageModal(viewEl.dataset.viewImg);
      }
    });

    function appendTyping(label) {
      const wrap = document.createElement("div");
      wrap.className = "msg bot";
      wrap.id = "typingIndicator";
      wrap.innerHTML = `
        <div class="msg-meta"><span>${label ? "🎨 Believe AI Image" : "⚡ Believe AI"}</span></div>
        <div class="bubble">
          <div class="typing-wrap">
            <div class="typing"><span></span><span></span><span></span></div>
            ${label ? `<span>${escapeHtml(label)}</span>` : ""}
          </div>
        </div>
      `;
      chatBox.appendChild(wrap);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function removeTyping() {
      document.getElementById("typingIndicator")?.remove();
    }

    function preloadImage(url, timeoutMs = 45000) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const timer = setTimeout(() => {
          img.onload = img.onerror = null;
          reject(new Error("Image server slow hai, thodi der baad dobara try karo."));
        }, timeoutMs);
        img.onload = () => { clearTimeout(timer); resolve(); };
        img.onerror = () => { clearTimeout(timer); reject(new Error("Image generate nahi ho payi, dobara try karo.")); };
        img.src = url;
      });
    }

    async function sendMessage(rawText) {
      const text = rawText.trim();
      const attached = pendingImage;
      if ((!text && !attached) || isBusy) return;

      isBusy = true;
      sendBtn.disabled = true;
      promptInput.value = "";
      promptInput.style.height = "auto";
      clearAttachment();

      if (attached && state.mode === "image") {
        state.mode = "auto";
        applyTheme();
      }

      const userMsg = {
        role: "user",
        text: text || "Is photo ke baare mein batao"
      };
      if (attached) {
        userMsg.image = { mimeType: attached.mimeType, data: attached.data };
        userMsg.previewUrl = attached.previewUrl;
      }

      state.messages.push(userMsg);
      saveState();
      renderChat();

      if (state.mode === "image" && !attached) {
        appendTyping("Image ban rahi hai (5–15 sec)...");
        try {
          const seed = Math.floor(Math.random() * 1000000);
          const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?width=1024&height=1152&seed=${seed}&nologo=true`;
          await preloadImage(imgUrl);
          removeTyping();
          state.messages.push({
            role: "model",
            type: "image",
            text: `Generated image: ${text}`,
            url: imgUrl,
            prompt: text
          });
        } catch (err) {
          removeTyping();
          state.messages.push({ role: "model", text: `⚠️ **Image Error:** ${err.message}` });
        } finally {
          saveState();
          renderChat();
          isBusy = false;
          sendBtn.disabled = false;
          promptInput.focus();
        }
        return;
      }

      appendTyping();

      try {
        const recent = state.messages.slice(-20);
        const recentHistory = recent.map((m, i) => ({
          role: m.role,
          text: m.type === "image" ? `[Generated image for: ${m.prompt}]` : m.text,
          image: i >= recent.length - 2 && m.image ? m.image : undefined
        }));

        const res = await fetch("/api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            history: recentHistory,
            mode: state.mode,
            vibe: state.vibe
          })
        });

        const data = await res.json().catch(() => ({}));
        removeTyping();

        if (!res.ok) throw new Error(data.error || `Server error (${res.status})`);

        state.messages.push({
          role: "model",
          text: data.reply || "Hmph... signal cut gaya. Dobara bol."
        });
      } catch (err) {
        removeTyping();
        state.messages.push({
          role: "model",
          text: `⚠️ **Connection Error:** ${err.message}`
        });
      } finally {
        saveState();
        renderChat();
        isBusy = false;
        sendBtn.disabled = false;
        promptInput.focus();
      }
    }

    modeBar.addEventListener("click", (e) => {
      const btn = e.target.closest(".mode-btn");
      if (!btn) return;
      state.mode = btn.dataset.mode;
      saveState();
      applyTheme();
      if (state.messages.length === 0) renderChat();
    });

    vibeSelect.addEventListener("change", () => {
      state.vibe = vibeSelect.value;
      saveState();
    });

    clearBtn.addEventListener("click", () => {
      if (isBusy) return;
      state.messages = [];
      clearAttachment();
      saveState();
      renderChat();
    });

    composer.addEventListener("submit", (e) => {
      e.preventDefault();
      sendMessage(promptInput.value);
    });

    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage(promptInput.value);
      }
    });

    promptInput.addEventListener("input", () => {
      promptInput.style.height = "auto";
      promptInput.style.height = Math.min(promptInput.scrollHeight, 140) + "px";
    });

    applyTheme();
    renderChat();
  </script>
</body>
